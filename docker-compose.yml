services:
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - renderer
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: grafana-renderer
    environment:
      ENABLE_METRICS: "true"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  load-cpu:
    image: busybox:1.36
    container_name: teste-cpu
    profiles: ["carga"]
    command: ["sh", "-c", "while true; do :; done"]
    restart: unless-stopped

  load-memory:
    image: polinux/stress-ng:latest
    container_name: teste-memoria
    profiles: ["carga"]
    command: ["--vm", "1", "--vm-bytes", "256M", "--vm-keep"]
    restart: unless-stopped

  load-io:
    image: busybox:1.36
    container_name: teste-io
    profiles: ["carga"]
    command: ["sh", "-c", "while true; do dd if=/dev/zero of=/carga/teste.dat bs=1M count=64 conv=fsync; rm -f /carga/teste.dat; done"]
    volumes:
      - carga-io:/carga
    restart: unless-stopped

  load-network:
    image: curlimages/curl:8.10.1
    container_name: teste-rede
    profiles: ["carga"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do curl -fsS -o /dev/null http://prometheus:9090/-/healthy; done"]
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  carga-io:
